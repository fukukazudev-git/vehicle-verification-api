spring:
  application:
    name: vehicle-verification-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/verification_db}
    username: ${SPRING_DATASOURCE_USERNAME:appuser}
    password: ${SPRING_DATASOURCE_PASSWORD:apppassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  profiles:
    active: local #本番時はprodに変更
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-32-characters}
  expiration: 86400000
  
storage:
  local:
    path: ${LOCAL_STORAGE_PATH:./uploads} # ローカル保存先
  s3:
    bucket: ${S3_BUCKET_NAME:vehicle-verification-attachments}
    region: ${S3_REGION:ap-northeast-1}
